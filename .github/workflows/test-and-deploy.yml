name: Test and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Dependency audit (non-blocking)
        continue-on-error: true
        run: yarn npm audit --severity high

      - name: Run linter
        run: yarn lint

      - name: Check experience-sync content
        run: yarn exp:check

      - name: Check visual baseline sync (Darwin vs Linux snapshots)
        run: node scripts/check-visual-baseline-sync.mjs

      - name: Run unit tests
        run: yarn test

      - name: Build
        run: yarn build

      - name: Check build output
        run: |
          echo "Checking build output..."
          du -sh build/assets/*.js | sort -h
          echo ""
          echo "Total build size:"
          du -sh build
          echo ""
          echo "Build completed successfully"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: yarn test:e2e

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: build/
          retention-days: 7

      - name: Upload E2E test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/test_results/e2e/html-report/
          retention-days: 30

      - name: Upload E2E screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: tests/test_results/e2e/results/
          retention-days: 30

  deploy:
    name: Production Deployment
    needs: test
    if: ${{ github.ref_name == 'main' && github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: true
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Start deployment
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              required_contexts: [],
              auto_merge: false,
              description: 'Deploy to Cloudflare Pages'
            });

            return deployment.data.id;

      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=portfolio --commit-hash=${{ github.sha }}

      - name: Verify Cloudflare Pages deployment
        id: verify
        run: |
          echo "⏳ Polling https://nickhs.dev until it responds successfully..."
          ATTEMPTS=24
          DELAY=10
          for i in $(seq 1 "$ATTEMPTS"); do
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 "https://nickhs.dev/" || echo "000")
            echo "Attempt $i/$ATTEMPTS — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Production site is reachable"
              echo "deploy_ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep "$DELAY"
          done
          echo "❌ Production site did not return HTTP 200 within $((ATTEMPTS * DELAY))s"
          echo "deploy_ok=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Update deployment status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ steps.verify.outcome }}' === 'success';
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: ok ? 'success' : 'failure',
              environment_url: 'https://nickhs.dev',
              description: ok
                ? 'Production site verified reachable'
                : 'Production site verification failed',
              auto_inactive: true
            });

      - name: Create deployment summary
        if: success()
        run: |
          echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Your site has been deployed to production!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌍 Live Site" >> $GITHUB_STEP_SUMMARY
          echo "**[https://nickhs.dev](https://nickhs.dev)** ✨" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Deployment Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Production" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: [\`${GITHUB_SHA:0:7}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by**: GitHub Actions (Wrangler)" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment ID**: \`${{ steps.deployment.outputs.result }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Verification**: HTTP 200 from https://nickhs.dev" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "💡 View deployment history in the [Environments](https://github.com/${{ github.repository }}/deployments) tab" >> $GITHUB_STEP_SUMMARY
